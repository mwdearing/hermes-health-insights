# Dietary Reference Intakes used by `health_insights.cli nutrition`. This table is for adult men, life-stage group 31-50 years; copy and edit it for another group and pass it with --dri.
# Sources: NIH Office of Dietary Supplements fact sheets (Table 1 RDAs/AIs, Table 3/4 ULs) and the Dietary Guidelines
# for Americans 2020-2025 (macronutrient limits). Values are reference amounts, not advice. Re-verify when the
# life-stage group changes (51-70 changes calcium, vitamin D and B6).
# Verified 2026-09-23 against the ODS fact sheets fetched through the local Firecrawl (rows 19-50 / 31-50, Male);
# the sodium value is from the 2019 DRI report (the ODS page did not fetch). Log: vault Memory/Projects/Nutrition.
#
# type:  rda = Recommended Dietary Allowance, ai = Adequate Intake, limit = upper bound to stay under (CDRR/DGA),
#        amdr = share of energy (range), none = no reference (informational only)
# ul:    Tolerable Upper Intake Level from supplements+food (null = not established)
# apple: the Apple Health type_code in the merged history (dietary_*), null when the food log has no such type yet
group: male 31-50
# Energy target inputs (sex, age_years, pal, goal_kcal, activity_factor) are personal: set them under `profile:` in
# ~/.config/health-insights/config.yaml. pal = sedentary | low_active | active | very_active (IOM 2005 EER);
# goal_kcal = daily offset from maintenance (0 = maintain). Without a profile there is no energy target.
energy_unit: kcal
nutrients:
  fiber:            {label: Fiber,          unit: g,   type: ai,    target: 38,   ul: null, apple: dietary_fiber,              source: "DGA 2020-2025 (14 g per 1,000 kcal; 38 g for men 31-50)"}
  protein:          {label: Protein,        unit: g,   type: rda,   target: 56,   ul: null, apple: dietary_protein,            per_kg: 0.8, source: "DRI macronutrients 2005: 0.8 g/kg/day (56 g reference male)"}
  carbohydrates:    {label: Carbohydrates,  unit: g,   type: rda,   target: 130,  ul: null, apple: dietary_carbohydrates,      source: "DRI macronutrients 2005"}
  fat_total:        {label: Total fat,      unit: g,   type: amdr,  energy_share: [0.20, 0.35], kcal_per_unit: 9, apple: dietary_fat_total, source: "DRI AMDR 20-35% of energy"}
  fat_saturated:    {label: Saturated fat,  unit: g,   type: limit, energy_share_max: 0.10, kcal_per_unit: 9, apple: dietary_fat_saturated, source: "DGA 2020-2025: under 10% of energy"}
  fat_monounsaturated: {label: Monounsaturated fat, unit: g, type: none, apple: dietary_fat_monounsaturated, source: "no DRI"}
  fat_polyunsaturated: {label: Polyunsaturated fat, unit: g, type: none, apple: dietary_fat_polyunsaturated, source: "no DRI"}
  cholesterol:      {label: Cholesterol,    unit: mg,  type: none,  apple: dietary_cholesterol,        source: "DGA: no numeric limit; keep intake low"}
  sugar:            {label: Sugar (total),  unit: g,   type: none,  apple: dietary_sugar,              source: "DGA limits ADDED sugars to 10% of energy; Apple logs total sugar"}
  sodium:           {label: Sodium,         unit: mg,  type: limit, target: 2300, ul: null, apple: dietary_sodium,             source: "DRI 2019 CDRR 2,300 mg; AI 1,500 mg"}
  potassium:        {label: Potassium,      unit: mg,  type: ai,    target: 3400, ul: null, apple: dietary_potassium,          source: "DRI 2019 AI men 19-50: 3,400 mg"}
  calcium:          {label: Calcium,        unit: mg,  type: rda,   target: 1000, ul: 2500, apple: dietary_calcium,            source: "ODS Calcium: RDA men 19-50 1,000 mg; UL 2,500 mg"}
  iron:             {label: Iron,           unit: mg,  type: rda,   target: 8,    ul: 45,   apple: dietary_iron,               source: "ODS Iron: RDA men 19-50 8 mg; UL 45 mg"}
  vitamin_c:        {label: Vitamin C,      unit: mg,  type: rda,   target: 90,   ul: 2000, apple: dietary_vitamin_c,          source: "ODS Vitamin C: RDA men 19+ 90 mg; UL 2,000 mg"}
  water:            {label: Water,          unit: mL,  type: ai,    target: 3700, ul: null, apple: dietary_water,              source: "DRI 2005 AI men 19+: 3.7 L total water"}
  # Vitamins and minerals Apple Health can record but the current food log does not (apple type exists, no rows yet):
  vitamin_d:        {label: Vitamin D,      unit: mcg, type: rda,   target: 15,   ul: 100,  apple: dietary_vitamin_d,          lab: "25-hydroxyvitamin D (LOINC 1989-3)", source: "ODS Vitamin D: RDA 19-70 15 mcg (600 IU); UL 100 mcg"}
  vitamin_b12:      {label: Vitamin B12,    unit: mcg, type: rda,   target: 2.4,  ul: null, apple: dietary_vitamin_b12,        lab: "Vitamin B12 (LOINC 2132-9)", source: "ODS Vitamin B12: RDA adults 2.4 mcg"}
  folate:           {label: Folate,         unit: mcg, type: rda,   target: 400,  ul: 1000, apple: dietary_folate,             lab: "Folate, serum (LOINC 2284-8)", source: "ODS Folate: RDA adults 400 mcg DFE; UL 1,000 mcg folic acid"}
  magnesium:        {label: Magnesium,      unit: mg,  type: rda,   target: 420,  ul: 350,  apple: dietary_magnesium,          lab: "Magnesium, serum (LOINC 19123-9)", source: "ODS Magnesium: RDA men 31-50 420 mg; UL 350 mg from supplements only"}
  zinc:             {label: Zinc,           unit: mg,  type: rda,   target: 11,   ul: 40,   apple: dietary_zinc,               source: "ODS Zinc: RDA men 11 mg; UL 40 mg"}
  vitamin_a:        {label: Vitamin A,      unit: mcg, type: rda,   target: 900,  ul: 3000, apple: dietary_vitamin_a,          source: "ODS Vitamin A: RDA men 900 mcg RAE; UL 3,000 mcg preformed"}
  vitamin_e:        {label: Vitamin E,      unit: mg,  type: rda,   target: 15,   ul: 1000, apple: dietary_vitamin_e,          source: "ODS Vitamin E: RDA adults 15 mg; UL 1,000 mg supplemental"}
  vitamin_k:        {label: Vitamin K,      unit: mcg, type: ai,    target: 120,  ul: null, apple: dietary_vitamin_k,          source: "ODS Vitamin K: AI men 120 mcg"}
  vitamin_b6:       {label: Vitamin B6,     unit: mg,  type: rda,   target: 1.3,  ul: 100,  apple: dietary_vitamin_b6,         source: "ODS Vitamin B6: RDA 19-50 1.3 mg; UL 100 mg"}
  thiamin:          {label: Thiamin (B1),   unit: mg,  type: rda,   target: 1.2,  ul: null, apple: dietary_thiamin,            source: "ODS Thiamin: RDA men 1.2 mg"}
  riboflavin:       {label: Riboflavin (B2), unit: mg, type: rda,   target: 1.3,  ul: null, apple: dietary_riboflavin,         source: "ODS Riboflavin: RDA men 1.3 mg"}
  niacin:           {label: Niacin (B3),    unit: mg,  type: rda,   target: 16,   ul: 35,   apple: dietary_niacin,             source: "ODS Niacin: RDA men 16 mg NE; UL 35 mg supplemental"}
  selenium:         {label: Selenium,       unit: mcg, type: rda,   target: 55,   ul: 400,  apple: dietary_selenium,           source: "ODS Selenium: RDA adults 55 mcg; UL 400 mcg"}
  copper:           {label: Copper,         unit: mcg, type: rda,   target: 900,  ul: 10000, apple: dietary_copper,            source: "ODS Copper: RDA adults 900 mcg; UL 10,000 mcg"}
  phosphorus:       {label: Phosphorus,     unit: mg,  type: rda,   target: 700,  ul: 4000, apple: dietary_phosphorus,         source: "ODS Phosphorus: RDA adults 700 mg; UL 4,000 mg"}
  iodine:           {label: Iodine,         unit: mcg, type: rda,   target: 150,  ul: 1100, apple: dietary_iodine,             source: "ODS Iodine: RDA adults 150 mcg; UL 1,100 mcg"}
  pantothenic_acid: {label: Pantothenic acid (B5), unit: mg, type: ai, target: 5, ul: null, apple: dietary_pantothenic_acid, source: "ODS Pantothenic Acid: AI adults 5 mg"}
  biotin:           {label: Biotin (B7),    unit: mcg, type: ai,    target: 30,   ul: null, apple: dietary_biotin,             source: "ODS Biotin: AI adults 30 mcg"}
  chromium:         {label: Chromium,       unit: mcg, type: ai,    target: 35,   ul: null, apple: dietary_chromium,           source: "ODS Chromium: AI men 19-50 35 mcg"}
  manganese:        {label: Manganese,      unit: mg,  type: ai,    target: 2.3,  ul: 11,   apple: dietary_manganese,          source: "ODS Manganese: AI men 2.3 mg; UL 11 mg"}
  molybdenum:       {label: Molybdenum,     unit: mcg, type: rda,   target: 45,   ul: 2000, apple: dietary_molybdenum,         source: "ODS Molybdenum: RDA adults 45 mcg; UL 2,000 mcg"}
  choline:          {label: Choline,        unit: mg,  type: ai,    target: 550,  ul: 3500, apple: null,                       source: "ODS Choline: AI men 550 mg; UL 3,500 mg (Apple Health has no choline type)"}
# Supplement-candidate rule (informational): a vitamin or mineral whose 7-day average is under `low_share` of its
# RDA/AI on at least `low_days` of the logged days. Fiber, potassium, water and macros are diet items, not pills.
rules:
  low_share: 0.70
  low_days: 4
  min_logged_days: 4          # fewer logged days in the window -> report "not enough food-log days"
  partial_day_kcal: 1200      # a logged day under this energy is probably incomplete: counted, flagged
  supplement_kinds: [vitamin, mineral]
kinds:
  vitamin: [vitamin_c, vitamin_d, vitamin_b12, folate, vitamin_a, vitamin_e, vitamin_k, vitamin_b6, thiamin, riboflavin, niacin, pantothenic_acid, biotin, choline]
  mineral: [calcium, iron, magnesium, zinc, selenium, copper, phosphorus, iodine, chromium, manganese, molybdenum, potassium, sodium]
